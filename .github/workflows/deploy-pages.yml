name: Publish original Nocturne without 3D bottle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Avern changes
        uses: actions/checkout@v4
      - name: Checkout original Nocturne
        uses: actions/checkout@v4
        with:
          repository: ProPanda32/Nocturne
          ref: 327a1e4904e5c3fa8f6b702664a7633779989084
          path: source
      - name: Include particle composition editor
        run: cp editor/particle-composition.ts source/src/particle-composition.ts && cp editor/particle-composition.css source/src/particle-composition.css
      - name: Remove only the bottle model
        run: python scripts/remove-bottle.py
      - name: Fix Creator Studio controls
        run: python scripts/fix-creator.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund
      - name: Build original site for Avern
        working-directory: source
        run: npm run build
      - name: Install presentation renderer
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress poppler-utils
          fi
      - name: Render uploaded presentation
        run: python scripts/render-slides.py "Averna Presentation.pptx" source/dist/slides
      - name: Include Averna artwork
        run: cp assets/averna-hero.png source/dist/assets/averna-hero.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
